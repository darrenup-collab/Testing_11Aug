name: Permission Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build permission
        run: |
          echo "Build job is running"
          echo "This job only needs contents: read"

  security:
    name: Security Job
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Security scan simulation
        run: |
          echo "Security job is running"
          echo "This job has security-events: write"

  issue:
    name: Issue Job
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Issue automation simulation
        run: |
          echo "Issue job is running"
          echo "This job has issues: write"
